<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>제목</title>
<style>
/* 폰트: 아리따 돋움(Arita Dotum KR)은 전사 PC에 자동 설치되므로 파일에 담지 않는다.
   이 서체는 굵기마다 파일이 따로이고 Regular가 없어서, local()로 굵기를 직접 연결한다.
   400·500은 Medium, 600은 SemiBold, 700·800은 Bold로 간다. 설치되지 않은 PC는 Pretendard → 맑은 고딕 순으로 대체된다. */
@font-face{font-family:"Arita Dotum KR";font-weight:300;src:local("Arita Dotum KR Light"),local("AritaDotumKR-Light")}
@font-face{font-family:"Arita Dotum KR";font-weight:400;src:local("Arita Dotum KR Medium"),local("AritaDotumKR-Medium")}
@font-face{font-family:"Arita Dotum KR";font-weight:500;src:local("Arita Dotum KR Medium"),local("AritaDotumKR-Medium")}
@font-face{font-family:"Arita Dotum KR";font-weight:600;src:local("Arita Dotum KR SemiBold"),local("AritaDotumKR-SemiBold")}
@font-face{font-family:"Arita Dotum KR";font-weight:700;src:local("Arita Dotum KR Bold"),local("AritaDotumKR-Bold")}
@font-face{font-family:"Arita Dotum KR";font-weight:800;src:local("Arita Dotum KR Bold"),local("AritaDotumKR-Bold")}
:root{
  --amore-blue:#1F5795; --pacific-blue:#001C58; --black:#000000;
  --gray:#7D7D7D; --white:#FFFFFF; --off-white:#F7F9FC;
  --light-gray:#E6EAF0; --mid-gray:#B8C0CC; --dark-gray:#333333;
  --tint-blue:#F7FBFF; --pale-blue:#B8CDE6;
  --alert-red:#D9291C; --soft-red:#FDECEA;
  --success-green:#1C8C5A; --soft-green:#EAF6F0;
  --amber:#F2A900; --soft-amber:#FFF4D6;
  --font-main:"Arita Dotum KR","Pretendard","Pretendard Variable","Malgun Gothic","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#dfe4ea;font-family:var(--font-main);color:var(--dark-gray)}
.deck{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:22px;overflow:auto}
.slide{position:relative;flex:0 0 auto;word-break:keep-all;overflow-wrap:break-word;width:1920px;height:1080px;background:var(--white);overflow:hidden;
  transform-origin:center center;box-shadow:0 18px 60px rgba(0,28,88,.13);display:none}
.slide.active{display:block}

/* 공통 라인 · 푸터 */
.topline{position:absolute;left:32px;right:32px;top:107px;height:1px;background:#111;opacity:.4}
.footerline{position:absolute;left:32px;right:32px;bottom:70px;height:1px;background:#111;opacity:.35}
.slide-title{position:absolute;left:39px;top:46px;font-size:27px;font-weight:700;color:#000;letter-spacing:-.035em}
.page-no{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font-size:16px;color:var(--gray)}
.footer-left{position:absolute;left:32px;bottom:4px;width:283px}
.footer-right{position:absolute;right:12px;bottom:4px;width:283px}
.cover-header{position:absolute;left:160px;top:108px;width:331px}
.content-header{position:absolute;right:39px;top:74px;width:231px}

/* 콘텐츠 영역 */
.content{position:absolute;left:115px;right:115px;top:170px;bottom:118px}
.headline{margin:0 0 28px;color:var(--pacific-blue);font-size:44px;line-height:1.2;
  letter-spacing:-.055em;font-weight:800}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px}
.card{border:1px solid var(--light-gray);border-radius:14px;padding:28px;background:#fff}
.card.active{background:var(--tint-blue);border:3px solid var(--amore-blue)}
.card h3{margin:0 0 14px;font-size:29px;line-height:1.2;color:var(--pacific-blue);letter-spacing:-.035em}
.card p{margin:0;font-size:24px;line-height:1.4;color:#4b5563}
.label{font-size:18px;font-weight:700;color:var(--amore-blue);text-transform:uppercase;margin-bottom:8px}
.emphasis{background:var(--off-white);border-left:8px solid var(--amore-blue);border-radius:8px;
  padding:24px 28px;font-size:26px;line-height:1.32;font-weight:600;color:var(--pacific-blue)}
.caption{font-size:16px;color:var(--gray)}

/* 표지 */
.cover-title{position:absolute;left:158px;top:400px;right:158px;margin:0;font-size:78px;
  font-weight:800;letter-spacing:-.055em;line-height:1.1;color:#000}
.cover-sub{position:absolute;left:158px;top:absolute;font-size:24px;color:var(--gray)}
.coverline{position:absolute;left:158px;right:158px;height:1px;background:#222;opacity:.75}


/* 직접 수정 모드 (E 키): 글자를 브라우저에서 바로 고치고 '수정본 저장'으로 새 파일을 받는다 */
body.editing [data-ed]{cursor:text}
body.editing [data-ed]:hover{outline:2px dashed var(--pale-blue);outline-offset:3px}
body.editing [data-ed]:focus{outline:2px solid var(--amore-blue);outline-offset:3px;border-radius:2px}
#editbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:100;display:flex;gap:6px;align-items:center;
  background:#fff;border:1px solid var(--light-gray);border-radius:999px;padding:6px 8px 6px 16px;
  box-shadow:0 8px 30px rgba(0,28,88,.18);font:600 13px/1 var(--font-main);color:var(--pacific-blue)}
#editbar button{border:0;border-radius:999px;padding:8px 14px;background:var(--off-white);color:var(--pacific-blue);font:inherit;cursor:pointer}
#editbar button[data-a=save]{background:var(--amore-blue);color:#fff}
@media print{#editbar{display:none}}

@media print{
  html,body{background:#fff}.deck{padding:0;display:block}
  .slide{display:block;transform:none!important;page-break-after:always;box-shadow:none}
  .controls{display:none}
}
</style>
<noscript><style>
/* 스크립트가 꺼진 미리보기(맥 Finder 스페이스바 등)용: 모든 슬라이드를 세로로 쌓고 창 폭에 맞춰 줄인다 */
.deck{display:block;min-height:0;padding:12px;overflow:visible}
.slide{display:block!important;margin:0 auto 14px;zoom:tan(atan2(calc(100vw - 24px),1920px))}
</style></noscript>
</head>
<body>
<div class="deck" id="deck">

  <!-- 01 · 표지 -->
  <section class="slide active">
    <img class="cover-header" src="{{ASSET:cover_header}}" alt="AMOREPACIFIC">
    <h1 class="cover-title">여기에 결론형 제목</h1>
    <img class="footer-left" src="{{ASSET:footer_left}}" alt="Create New Beauty">
    <img class="footer-right" src="{{ASSET:footer_right}}" alt="Beauty in Motion">
  </section>

  <!-- 02 · 본문 -->
  <section class="slide">
    <div class="slide-title">문서 제목</div>
    <img class="content-header" src="{{ASSET:content_header}}" alt="AMOREPACIFIC">
    <div class="topline"></div><div class="footerline"></div>
    <div class="page-no">02</div>
    <div class="content">
      <h2 class="headline">제목만 읽어도 논지가 완성되는 결론 문장</h2>
      <div class="cards">
        <article class="card"><div class="label">01 · Label</div><h3>카드 제목</h3><p>본문</p></article>
        <article class="card"><div class="label">02 · Label</div><h3>카드 제목</h3><p>본문</p></article>
        <article class="card active"><div class="label">03 · Label</div><h3>카드 제목</h3><p>본문</p></article>
      </div>
    </div>
    <img class="footer-left" src="{{ASSET:footer_left}}" alt="Create New Beauty">
    <img class="footer-right" src="{{ASSET:footer_right}}" alt="Beauty in Motion">
  </section>

</div>
<script>
(function(){
  const slides=[...document.querySelectorAll('.slide')];
  let i=0, lock=0;
  const deck=document.getElementById('deck');
  function fit(){
    const s=Math.min((innerWidth-44)/1920,(innerHeight-44)/1080);
    slides.forEach(el=>el.style.transform=`scale(${Math.max(.2,s)})`);
    deck.style.height=(1080*s+44)+'px';
  }
  function show(n){
    i=Math.max(0,Math.min(slides.length-1,n));
    slides.forEach((el,k)=>el.classList.toggle('active',k===i));
  }
  addEventListener('resize',fit); new ResizeObserver(fit).observe(document.documentElement); fit();
  // ── 직접 수정 모드: E 키로 켜고, Esc 또는 '편집 끝'으로 끈다 ─────────
  let editing=false, bar=null;
  const EDIT_ROOT='.slide';
  function markEditable(){
    document.querySelectorAll(EDIT_ROOT+' *').forEach(el=>{
      if(/^(SCRIPT|STYLE|IMG|BR)$/i.test(el.tagName)||el.closest('svg,button,[data-ed]')) return;
      if([...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim())){
        el.setAttribute('contenteditable','true'); el.setAttribute('data-ed',''); el.setAttribute('spellcheck','false');
      }
    });
  }
  function unmarkEditable(root){
    root.querySelectorAll('[data-ed]').forEach(n=>{
      n.removeAttribute('contenteditable'); n.removeAttribute('data-ed'); n.removeAttribute('spellcheck');
    });
  }
  function snapshot(){
    const c=document.documentElement.cloneNode(true);
    c.querySelectorAll('#editbar').forEach(n=>n.remove());
    unmarkEditable(c);
    const b=c.querySelector('body'); b.classList.remove('editing'); if(!b.getAttribute('class')) b.removeAttribute('class');
    c.querySelectorAll('.slide').forEach(el=>{el.style.removeProperty('transform'); if(!el.getAttribute('style')) el.removeAttribute('style');});
    const d=c.querySelector('#deck'); if(d){d.style.removeProperty('height'); if(!d.getAttribute('style')) d.removeAttribute('style');}
    const t=c.querySelector('#tuner'); if(t) t.classList.remove('on');
    return '<!DOCTYPE html>\n'+c.outerHTML;
  }
  function saveCopy(){
    const name=decodeURIComponent(location.pathname.split('/').pop()||'slides').replace(/\.html?$/i,'').replace(/_edited$/,'');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([snapshot()],{type:'text/html'}));
    a.download=name+'_edited.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  function setEdit(on){
    editing=on; document.body.classList.toggle('editing',on);
    if(on){
      markEditable();
      bar=document.createElement('div'); bar.id='editbar';
      bar.innerHTML='<span>수정 중</span><button type="button" data-a="prev">◀</button><button type="button" data-a="next">▶</button><button type="button" data-a="save">수정본 저장</button><button type="button" data-a="done">편집 끝</button>';
      bar.addEventListener('click',e=>{
        const a=e.target.dataset&&e.target.dataset.a;
        if(a==='prev') show(i-1); else if(a==='next') show(i+1);
        else if(a==='save') saveCopy(); else if(a==='done') setEdit(false);
      });
      document.body.appendChild(bar);
    }else{
      unmarkEditable(document); if(bar){bar.remove(); bar=null;}
    }
  }
  addEventListener('paste',e=>{
    if(!editing||!e.target.isContentEditable) return;
    e.preventDefault();
    document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'));
  });

  addEventListener('keydown',e=>{
    if(editing){
      if(e.key==='Escape') setEdit(false);
      else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault(); saveCopy();}
      else if(e.key==='Enter'&&!e.shiftKey&&e.target.isContentEditable){e.preventDefault(); document.execCommand('insertLineBreak');}
      return;
    }
    const k=e.key;
    if(k==='e'||k==='E') setEdit(true);
    else if(k==='ArrowRight'||k===' '||k==='PageDown') show(i+1);
    else if(k==='ArrowLeft'||k==='PageUp') show(i-1);
    else if(k==='Home') show(0);
    else if(k==='End') show(slides.length-1);
    else if(k==='f'||k==='F') document.documentElement.requestFullscreen?.();
    else if(k==='p'||k==='P') print();
  });
  addEventListener('wheel',e=>{
    if(editing) return;
    const now=Date.now(); if(now-lock<600) return; lock=now;
    show(i+(e.deltaY>0?1:-1));
  },{passive:true});
})();
</script>
</body>
</html>
