<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>제목</title>
<style>
:root{
  --amore-blue:#1F5795; --pacific-blue:#001C58; --black:#000000;
  --gray:#7D7D7D; --white:#FFFFFF; --off-white:#F7F9FC;
  --light-gray:#E6EAF0; --mid-gray:#B8C0CC; --dark-gray:#333333;
  --tint-blue:#F7FBFF; --pale-blue:#B8CDE6;
  --alert-red:#D9291C; --soft-red:#FDECEA;
  --success-green:#1C8C5A; --soft-green:#EAF6F0;
  --amber:#F2A900; --soft-amber:#FFF4D6;
  --font-main:"Pretendard","Malgun Gothic","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#dfe4ea;font-family:var(--font-main);color:var(--dark-gray)}
.deck{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:22px;overflow:auto}
.slide{position:relative;flex:0 0 auto;width:1920px;height:1080px;background:var(--white);overflow:hidden;
  transform-origin:center center;box-shadow:0 18px 60px rgba(0,28,88,.13);display:none}
.slide.active{display:block}

/* 공통 라인 · 푸터 */
.topline{position:absolute;left:32px;right:32px;top:107px;height:1px;background:#111;opacity:.4}
.footerline{position:absolute;left:32px;right:32px;bottom:70px;height:1px;background:#111;opacity:.35}
.slide-title{position:absolute;left:39px;top:46px;font-size:27px;font-weight:700;color:#000;letter-spacing:-.035em}
.page-no{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font-size:16px;color:var(--gray)}
.footer-left{position:absolute;left:32px;bottom:4px;width:283px}
.footer-right{position:absolute;right:12px;bottom:4px;width:283px}
.cover-header{position:absolute;left:160px;top:108px;width:331px}
.content-header{position:absolute;right:39px;top:74px;width:231px}

/* 콘텐츠 영역 */
.content{position:absolute;left:115px;right:115px;top:170px;bottom:118px}
.headline{margin:0 0 28px;color:var(--pacific-blue);font-size:44px;line-height:1.2;
  letter-spacing:-.055em;font-weight:800}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px}
.card{border:1px solid var(--light-gray);border-radius:14px;padding:28px;background:#fff}
.card.active{background:var(--tint-blue);border:3px solid var(--amore-blue)}
.card h3{margin:0 0 14px;font-size:29px;line-height:1.2;color:var(--pacific-blue);letter-spacing:-.035em}
.card p{margin:0;font-size:24px;line-height:1.4;color:#4b5563}
.label{font-size:18px;font-weight:700;color:var(--amore-blue);text-transform:uppercase;margin-bottom:8px}
.emphasis{background:var(--off-white);border-left:8px solid var(--amore-blue);border-radius:8px;
  padding:24px 28px;font-size:26px;line-height:1.32;font-weight:600;color:var(--pacific-blue)}
.caption{font-size:16px;color:var(--gray)}

/* 표지 */
.cover-title{position:absolute;left:158px;top:400px;right:158px;margin:0;font-size:78px;
  font-weight:800;letter-spacing:-.055em;line-height:1.1;color:#000}
.cover-sub{position:absolute;left:158px;top:absolute;font-size:24px;color:var(--gray)}
.coverline{position:absolute;left:158px;right:158px;height:1px;background:#222;opacity:.75}

@media print{
  html,body{background:#fff}.deck{padding:0;display:block}
  .slide{display:block;transform:none!important;page-break-after:always;box-shadow:none}
  .controls{display:none}
}
</style>
</head>
<body>
<div class="deck" id="deck">

  <!-- 01 · 표지 -->
  <section class="slide active">
    <img class="cover-header" src="{{ASSET:cover_header}}" alt="AMOREPACIFIC">
    <h1 class="cover-title">여기에 결론형 제목</h1>
    <img class="footer-left" src="{{ASSET:footer_left}}" alt="Create New Beauty">
    <img class="footer-right" src="{{ASSET:footer_right}}" alt="Beauty in Motion">
  </section>

  <!-- 02 · 본문 -->
  <section class="slide">
    <div class="slide-title">문서 제목</div>
    <img class="content-header" src="{{ASSET:content_header}}" alt="AMOREPACIFIC">
    <div class="topline"></div><div class="footerline"></div>
    <div class="page-no">02</div>
    <div class="content">
      <h2 class="headline">제목만 읽어도 논지가 완성되는 결론 문장</h2>
      <div class="cards">
        <article class="card"><div class="label">01 · Label</div><h3>카드 제목</h3><p>본문</p></article>
        <article class="card"><div class="label">02 · Label</div><h3>카드 제목</h3><p>본문</p></article>
        <article class="card active"><div class="label">03 · Label</div><h3>카드 제목</h3><p>본문</p></article>
      </div>
    </div>
    <img class="footer-left" src="{{ASSET:footer_left}}" alt="Create New Beauty">
    <img class="footer-right" src="{{ASSET:footer_right}}" alt="Beauty in Motion">
  </section>

</div>
<script>
(function(){
  const slides=[...document.querySelectorAll('.slide')];
  let i=0, lock=0;
  const deck=document.getElementById('deck');
  function fit(){
    const s=Math.min((innerWidth-44)/1920,(innerHeight-44)/1080);
    slides.forEach(el=>el.style.transform=`scale(${Math.max(.2,s)})`);
    deck.style.height=(1080*s+44)+'px';
  }
  function show(n){
    i=Math.max(0,Math.min(slides.length-1,n));
    slides.forEach((el,k)=>el.classList.toggle('active',k===i));
  }
  addEventListener('resize',fit); new ResizeObserver(fit).observe(document.documentElement); fit();
  addEventListener('keydown',e=>{
    const k=e.key;
    if(k==='ArrowRight'||k===' '||k==='PageDown') show(i+1);
    else if(k==='ArrowLeft'||k==='PageUp') show(i-1);
    else if(k==='Home') show(0);
    else if(k==='End') show(slides.length-1);
    else if(k==='f'||k==='F') document.documentElement.requestFullscreen?.();
    else if(k==='p'||k==='P') print();
  });
  addEventListener('wheel',e=>{
    const now=Date.now(); if(now-lock<600) return; lock=now;
    show(i+(e.deltaY>0?1:-1));
  },{passive:true});
})();
</script>
</body>
</html>
